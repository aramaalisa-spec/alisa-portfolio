<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick-up Location Modal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #ffffff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Roboto', sans-serif;
  /* Simulate being embedded in a page with content above/below */
}

/*
  ── Sizing strategy ──────────────────────────────────────────
  The modal has a FIXED height of 490px (matching the Figma frame).
  Both inner screens (picker, success) are position:absolute and fill
  it completely. The results list grows to fill available vertical space
  via flex:1 + min-height:0, and scrolls internally.
  Nothing inside ever changes the outer height → zero layout shift.
  ─────────────────────────────────────────────────────────────
*/

.modal {
  width: 668px;
  height: 490px;          /* Fixed — never changes */
  background: #ffffff;
  border-radius: 12px;
  border: 1px solid rgba(0,0,0,0.10);
  box-shadow: 0 4px 24px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.05);
  position: relative;     /* Stacking context for absolute children */
  overflow: hidden;       /* Clip anything that might overflow */
}

/* ── Picker screen ───────────────────────────────────────── */
.picker {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 32px 36px;
  transition: opacity 0.2s;
}
.picker--hidden { opacity: 0; pointer-events: none; }

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 22px;
  flex-shrink: 0;
}
.modal-title { font-size: 20px; font-weight: 500; color: #111111; line-height: 1.3; }
.modal-close {
  background: none; border: none; cursor: pointer; color: #BBBBBB;
  font-size: 22px; line-height: 1; padding: 0;
  font-family: 'Roboto', sans-serif; font-weight: 300;
  transition: color 0.12s; flex-shrink: 0;
}
.modal-close:hover { color: #555; }

.search-wrap { position: relative; margin-bottom: 10px; flex-shrink: 0; }
.search-input {
  width: 100%; height: 56px; padding: 0 52px 0 18px;
  font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 400;
  color: #111111; background: #F0F2F7; border: 1px solid #E2E6EF;
  border-radius: 8px; outline: none; transition: border-color 0.14s, background 0.14s;
}
.search-input:focus { border-color: #A8B4D0; background: #F5F6FA; }
.search-input::placeholder { color: #BBBBBB; }
.search-icon {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  color: #8B9EC3; pointer-events: none; display: flex;
}

.search-hint { font-size: 13px; color: #999999; margin-bottom: 14px; flex-shrink: 0; line-height: 1.4; }

/*
  Results area: flex:1 + min-height:0 is the key.
  flex:1 → grows to fill all remaining vertical space in the picker.
  min-height:0 → overrides the default min-height:auto so it can shrink
                 below its content height (essential for flex scroll children).
  The results div itself scrolls internally.
*/
.results-area {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.results {
  flex: 1;
  min-height: 0;
  border: 1px solid #E2E6EF;
  border-radius: 8px;
  overflow-y: auto;
}
.results::-webkit-scrollbar { width: 5px; }
.results::-webkit-scrollbar-track { background: transparent; }
.results::-webkit-scrollbar-thumb { background: #D0D5E8; border-radius: 99px; }
.results::-webkit-scrollbar-thumb:hover { background: #B0B8D0; }
.results--hidden { display: none; }

.empty-state {
  flex: 1;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: #BBBBBB;
  border: 1px solid #E2E6EF;
  border-radius: 8px;
}
.empty-state--visible { display: flex; }

/* Result rows */
.result-row {
  padding: 12px 18px; display: flex; align-items: flex-start; gap: 13px;
  border-bottom: 1px solid #ECEEF4; cursor: pointer;
  background: #ffffff; transition: background 0.1s;
}
.result-row:last-child { border-bottom: none; }
.result-row:hover:not(.result-row--full) { background: #FAFBFD; }
.result-row--full { cursor: default; }
.result-row--selected { background: #FAFBFD; }

.radio {
  flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid #CCCCCC; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
}
.radio--selected { border-color: #1E3558; background: #1E3558; }
.radio--selected::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff; display: block; }
.radio--dim { border-color: #DDDDDD; opacity: 0.4; }

.row-body { flex: 1; min-width: 0; }
.row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.row-name { font-size: 15px; color: #111111; line-height: 1.4; }
.row-name strong { font-weight: 700; }
.row-name--dim { color: #BBBBBB; }
.row-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.row-date { font-size: 13px; color: #888888; white-space: nowrap; }

.pill { display: inline-flex; align-items: center; font-size: 12px; border-radius: 99px; padding: 3px 10px; white-space: nowrap; line-height: 1.4; }
.pill--ok   { background: #E8F5EE; color: #2A7A4A; }
.pill--full { background: #FFF3E0; color: #C45C00; }

.row-hours { font-size: 13px; color: #999999; margin-top: 4px; line-height: 1.4; }

.nearby-link {
  display: inline-block; font-size: 13px; color: #2B6CB0;
  text-decoration: underline; text-underline-offset: 2px;
  cursor: pointer; background: none; border: none; padding: 0;
  font-family: 'Roboto', sans-serif; font-weight: 400; margin-top: 5px;
  transition: color 0.1s;
}
.nearby-link:hover { color: #1A4F8A; }

.nearby-section { display: none; }
.nearby-section--open { display: block; }
.nearby-label { font-size: 12px; color: #AAAAAA; padding: 7px 18px 5px 40px; background: #ffffff; border-top: 1px solid #ECEEF4; border-bottom: 1px solid #ECEEF4; }
.nearby-row {
  padding: 12px 18px 12px 40px; display: flex; align-items: center; gap: 13px;
  background: #ffffff; border-bottom: 1px solid #ECEEF4; cursor: pointer; transition: background 0.1s;
}
.nearby-row:last-child { border-bottom: none; }
.nearby-row:hover { background: #FAFBFD; }
.nearby-row--selected { background: #FAFBFD; }
.nearby-name { font-size: 15px; color: #111111; flex: 1; font-weight: 400; }
.nearby-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.cta { margin-top: 14px; flex-shrink: 0; }
.btn-confirm {
  width: 100%; height: 54px; background: #4B6FA5; color: #ffffff;
  border: none; border-radius: 8px; font-family: 'Roboto', sans-serif;
  font-size: 14px; font-weight: 600; letter-spacing: 0.09em;
  text-transform: uppercase; cursor: pointer; transition: background 0.14s;
}
.btn-confirm:hover:not(:disabled) { background: #3D5F94; }
.btn-confirm:active:not(:disabled) { background: #334F7D; }
.btn-confirm:disabled { background: #C8D2E8; cursor: default; }

/* ── Success screen ──────────────────────────────────────── */
.success {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 44px 48px 40px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s;
}
.success--visible { opacity: 1; pointer-events: auto; }

.roll-track {
  width: 100%;
  height: 72px;
  position: relative;
  overflow: hidden;
  margin-bottom: 28px;
  flex-shrink: 0;
}
.roll-logo {
  position: absolute;
  top: 50%;
  left: 0;
  width: 68px;
  height: 68px;
  margin-top: -34px;
  border-radius: 50%;
  overflow: hidden;
}
.roll-logo img { width: 100%; height: 100%; display: block; }

@keyframes roll-across {
  from { transform: translateX(-80px) rotate(0deg); }
  to   { transform: translateX(var(--roll-end, 668px)) rotate(1080deg); }
}
.roll-logo--go {
  animation: roll-across 2.0s cubic-bezier(0.38, 0, 0.55, 1) forwards;
}

.success-heading { font-size: 22px; font-weight: 500; color: #111111; margin-bottom: 8px; line-height: 1.3; flex-shrink: 0; }
.success-sub { font-size: 14px; color: #888888; margin-bottom: 24px; line-height: 1.5; flex-shrink: 0; }

.success-detail {
  background: #F5F6FA; border-radius: 8px; padding: 14px 20px;
  width: 100%; margin-bottom: 24px; text-align: left; flex-shrink: 0;
}
.success-detail-row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 16px; padding: 5px 0; font-size: 14px;
}
.success-detail-row + .success-detail-row { border-top: 1px solid #ECEEF4; }
.sdl { color: #999999; white-space: nowrap; }
.sdv { color: #111111; font-weight: 500; text-align: right; }

.btn-done {
  background: none; border: 1px solid #D0D5E8; color: #4B6FA5;
  border-radius: 8px; height: 46px; padding: 0 36px;
  font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 500;
  letter-spacing: 0.04em; cursor: pointer; flex-shrink: 0;
  transition: background 0.12s, border-color 0.12s;
}
.btn-done:hover { background: #F0F3FA; border-color: #B0B8D0; }
</style>
</head>
<body>

<!--
  In your Astro component this wrapper would be the component root.
  The 668×490 size is fixed — embed it inside whatever container you like.
  The page never reflowsbecause .modal height never changes.
-->
<div class="modal" id="modal">

  <!-- Picker screen -->
  <div class="picker" id="picker">
    <div class="modal-header">
      <h2 class="modal-title">Choose a pick-up point in Bucharest:</h2>
      <button class="modal-close" id="close-btn" aria-label="Close">&#215;</button>
    </div>

    <div class="search-wrap">
      <input type="search" class="search-input" id="search"
        placeholder="Enter street name, e.g. Calea Victoriei..." autocomplete="off">
      <span class="search-icon">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="9.5" cy="9.5" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M15 15L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
    </div>

    <p class="search-hint">Delivery date may vary by pick-up location</p>

    <div class="results-area">
      <div class="results" id="results"></div>
      <div class="empty-state" id="empty">No pick-up points found for that search.</div>
    </div>

    <div class="cta">
      <button class="btn-confirm" id="btn" disabled>Confirm pick-up location</button>
    </div>

const byId = Object.fromEntries(locations.map(l => [l.id, l]));
let selectedId = null;
let openNearby  = null;

function getMatches(q) {
  const ql = q.trim().toLowerCase();
  if (ql.length < 2) return [];
  return locations.filter(l => (l.addr + ' ' + l.venue).toLowerCase().includes(ql));
}

function render(list) {
  const box   = document.getElementById('results');
  const empty = document.getElementById('empty');
  if (!list.length) {
    box.innerHTML = '';
    box.classList.add('results--hidden');
    empty.classList.add('empty-state--visible');
    return;
  }
  empty.classList.remove('empty-state--visible');
  box.classList.remove('results--hidden');
  box.innerHTML = list.map(buildRow).join('');
  box.querySelectorAll('[data-pick]').forEach(el =>
    el.addEventListener('click', () => pick(el.dataset.pick)));
  box.querySelectorAll('[data-toggle]').forEach(btn =>
    btn.addEventListener('click', e => { e.stopPropagation(); toggle(btn.dataset.toggle); }));
  box.querySelectorAll('[data-np]').forEach(el =>
    el.addEventListener('click', e => { e.stopPropagation(); pick(el.dataset.np); }));
}

  const pickAttr   = l.ok ? 'data-pick="' + l.id + '"' : '';

  const nameHtml = l.ok
    ? '<span class="row-name"><strong>' + l.addr + ',</strong> ' + l.venue + '</span>'
    : '<span class="row-name row-name--dim">' + l.addr + ', ' + l.venue + '</span>';

  const rightHtml = '<div class="row-right">'
    + (l.ok && l.date ? '<span class="row-date">delivery ' + l.date + '</span>' : '')
    + (l.ok ? '<span class="pill pill--ok">available</span>' : '<span class="pill pill--full">shelves are full</span>')
    + '</div>';

  const hoursHtml = l.ok && l.hours && sel ? '<p class="row-hours">' + l.hours + '</p>' : '';

  const linkText = nearbyOpen ? 'Hide nearby alternatives' : 'Show available pick-up points within 400m';
  const linkHtml = !l.ok && l.nearby
    ? '<button class="nearby-link" data-toggle="' + l.id + '">' + linkText + '</button>' : '';

  let nearbyHtml = '';
  if (!l.ok && l.nearby && nearbyOpen) {
    const items = l.nearby.map(nid => {
      const n = byId[nid]; if (!n) return '';
      const nSel = selectedId === n.id;
      return '<div class="nearby-row' + (nSel ? ' nearby-row--selected' : '') + '" data-np="' + n.id + '">'
        + '<div class="radio' + (nSel ? ' radio--selected' : '') + '"></div>'
        + '<span class="nearby-name">' + n.addr + ', ' + n.venue + '</span>'
        + '<div class="nearby-right"><span class="row-date">delivery ' + n.date + '</span>'
        + '<span class="pill pill--ok">available</span></div>'
        + '</div>';
    }).join('');
    nearbyHtml = '<div class="nearby-section nearby-section--open">'
      + '<div class="nearby-label">Available within 400m</div>' + items + '</div>';
  }

  return '<div class="' + rowClass + '" ' + pickAttr + '>'
    + '<div class="' + radioClass + '"></div>'
    + '<div class="row-body"><div class="row-top">' + nameHtml + rightHtml + '</div>'
    + hoursHtml + linkHtml + '</div></div>' + nearbyHtml;
}

function pick(id) {
  selectedId = id;
  document.getElementById('btn').disabled = false;
  rerender();
}
function toggle(id) { openNearby = openNearby === id ? null : id; rerender(); }
function rerender() { render(getMatches(document.getElementById('search').value)); }

document.getElementById('search').addEventListener('input', function() {
  render(getMatches(this.value));
});

// ── Confirm → success ──────────────────────────────────────
document.getElementById('btn').addEventListener('click', showSuccess);

function showSuccess() {
  if (!selectedId) return;
  const l = byId[selectedId];

  document.getElementById('success-sub').textContent = l.addr + ', ' + l.venue;
  document.getElementById('success-detail').innerHTML =
    row('Pick-up location', l.addr + ', ' + l.venue)
    + row('Arriving', l.date || '—')
    + (l.hours ? row('Opening hours', l.hours) : '');

  // Switch screens (opacity fade, no layout shift)
  document.getElementById('picker').classList.add('picker--hidden');
  const suc = document.getElementById('success');
  suc.classList.add('success--visible');

  // Roll animation
  const track = document.getElementById('roll-track');
  const logo  = document.getElementById('roll-logo');
  logo.style.setProperty('--roll-end', (track.offsetWidth + 20) + 'px');
  logo.classList.remove('roll-logo--go');
  void logo.offsetWidth;
  logo.classList.add('roll-logo--go');
}

function row(label, value) {
  return '<div class="success-detail-row"><span class="sdl">' + label + '</span><span class="sdv">' + value + '</span></div>';
}

// ── Done → reset ───────────────────────────────────────────
document.getElementById('done-btn').addEventListener('click', reset);
document.getElementById('close-btn').addEventListener('click', reset);

function reset() {
  document.getElementById('success').classList.remove('success--visible');
  document.getElementById('picker').classList.remove('picker--hidden');
  document.getElementById('roll-logo').classList.remove('roll-logo--go');
}


</script>
</body>
</html>
